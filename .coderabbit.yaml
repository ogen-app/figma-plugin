# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review configuration. Overrides the dashboard defaults and is
# itself reviewed in PRs. Docs: https://docs.coderabbit.ai/reference/yaml-template
language: "en-US"
early_access: false
tone_instructions: "Be terse. Skip preamble and pleasantries. State the issue, why it matters, and the fix. Prefer diffs over prose."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!package-lock.json"
    - "!coverage/**"
    - "!**/.DS_Store"

  path_instructions:
    - path: "src/main/**/*.ts"
      instructions: |
        Figma plugin main thread (sandbox). It has the figma.* API but no DOM
        and no network: never call fetch here, all Ogen requests belong to the
        UI iframe. The manifest uses documentAccess "dynamic-page", so use the
        async node APIs (figma.getNodeByIdAsync, etc.); the sync variants throw.
        Keep exports sequential and one at a time: a large frame at 3x can be
        tens of MB and must not be buffered alongside others.

    - path: "src/ui/**/*.{ts,tsx}"
      instructions: |
        Plugin UI iframe (origin "null"). The only place that talks to the Ogen
        API. Normalize and guard API response data before it reaches state:
        coerce arrays (`data ?? []`) so a missing or null field cannot crash a
        `.map()`. The plugin token must never be logged, put in a URL, or
        shown in the UI.

    - path: "src/api/**/*.ts"
      instructions: |
        Client for the Ogen plugin API (/api/plugins/figma/*, contract in
        CON-338 §7.1). Error bodies are `{code, error}` for coded rejects and
        `{error}` otherwise; 402 quota bodies are
        `{error: "entitlement_exceeded", feature, limit, current}`. Every
        non-2xx must surface as an ApiError with status and code; a 401
        `plugin_token_invalid` must always lead to clearing the stored token.

    - path: "manifest.json"
      instructions: |
        networkAccess.allowedDomains must list only the production API origin;
        localhost and non-production environments (api.dev.getogen.com)
        belong in devAllowedDomains. Flag any wildcard domain or a
        reasoning field that does not match the domains listed.

    - path: "src/**/*.{ts,tsx}"
      instructions: |
        Prefer terse, minimal diffs. Do not add error handling or validation
        for cases that cannot happen at internal call sites; validate at the
        boundaries (API responses, postMessage payloads, clientStorage reads).
        Default to no comments unless the WHY is non-obvious.

    - path: "**/*.md"
      instructions: |
        Skip stylistic prose nits. Only flag factual errors, broken code
        samples, or stale references (renamed files, removed scripts,
        endpoints that no longer exist).

  tools:
    gitleaks:
      enabled: true
    eslint:
      enabled: true
    biome:
      enabled: true
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    ast-grep:
      essential_rules: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
