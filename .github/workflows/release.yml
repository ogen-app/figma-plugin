name: Release

# A v* tag builds the production plugin once and attaches it to a draft
# GitHub release. The publisher publishes those files to the Figma Community
# (RELEASE.md), then publishes the draft. Figma has no publish API, so that
# step stays manual.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Tests rebuild dist/ in dev mode, so the production build comes last.
      - run: npm run build:prod
      - run: npm run verify:release -- --tag "$GITHUB_REF_NAME"
      - name: Package
        run: |
          zip -r "ogen-figma-plugin-$GITHUB_REF_NAME.zip" manifest.json dist/code.js dist/ui.html
          sha256sum "ogen-figma-plugin-$GITHUB_REF_NAME.zip" manifest.json dist/code.js dist/ui.html > SHA256SUMS
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            "ogen-figma-plugin-$GITHUB_REF_NAME.zip" SHA256SUMS
